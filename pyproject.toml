[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "scoutiq"
version = "1.0.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
filterwarnings = [
    # mlflow ships Pydantic V1 validators — not fixable from here
    "ignore::DeprecationWarning:mlflow",
    # pydantic internals emit DeprecationWarning when loading mlflow's old-style config
    "ignore::DeprecationWarning:pydantic",
]
